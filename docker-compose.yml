services:
  app:
    build:
      context: ./app
    container_name: app
    environment:
      - APP_NAME=demo-app
      - APP_VERSION=0.1.0
      - GIT_COMMIT=local
    ports:
      - "8000:8000"
    networks: [mon]

  nginx:
    image: nginx:1.25
    container_name: nginx
    depends_on: [app]
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    networks: [mon]

  

networks:
  mon:
    driver: bridge
