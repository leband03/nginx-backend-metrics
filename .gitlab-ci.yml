stages: [lint, unit, build, integration]

services:
  - docker:27-dind

variables:
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375
  COMPOSE_PROJECT_NAME: "ci"

.docker_job:
  image: docker:27
  before_script:
    - docker version
    - docker info

lint:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install -r app/requirements.txt
    - python -m compileall app/main.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"

unit:
  stage: unit
  image: python:3.12-slim
  script:
    - pip install -r app/requirements.txt
    - cd app
    - pytest -q
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"

build:
  stage: build
  extends: .docker_job
  script:
    - docker compose build app
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"

integration:
  stage: integration
  extends: .docker_job
  script:
    - apk add --no-cache curl bash
    - docker compose up -d --build
    # ... остальное без изменений ...
  after_script:
    - docker compose ps || true
    - docker compose logs --no-color | tail -n 300 || true
    - docker compose down -v || true
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"
