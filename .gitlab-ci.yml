stages:
  - lint
  - unit
  - build
  - integration

# Чтобы docker compose работал в job
image: docker:27
services:
  - docker:27-dind

variables:
  DOCKER_TLS_CERTDIR: ""   # чтобы dind не ругался
  COMPOSE_PROJECT_NAME: "ci"

before_script:
  - docker version
  - docker info

lint:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install -r app/requirements.txt
    - python -m compileall app/main.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"

unit:
  stage: unit
  image: python:3.12-slim
  script:
    - pip install -r app/requirements.txt
    - cd app
    - pytest -q
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"

build:
  stage: build
  script:
    - docker compose build app
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"

integration:
  stage: integration
  script:
    - apk add --no-cache curl bash

    # поднять всё
    - docker compose up -d --build

    # подождать nginx
    - |
      echo "Waiting for nginx..."
      for i in $(seq 1 60); do
        curl -sSf http://nginx/ >/dev/null && break
        sleep 1
      done

    # проверить UI
    - curl -sSf http://nginx/ | head -n 5

    # проверить API через nginx
    - curl -sSf http://nginx/api/hello | grep -q "hello"

    # проверить health
    - curl -sSf http://nginx/health | grep -q "ok"

    # проверить метрики backend через nginx
    - curl -sSf http://nginx/app-metrics | grep -q "http_requests_total"

    # проверить Prometheus targets
    - |
      echo "Waiting for Prometheus..."
      for i in $(seq 1 60); do
        curl -sSf http://prometheus:9090/-/ready >/dev/null && break
        sleep 1
      done

    - curl -sSf http://prometheus:9090/api/v1/targets | grep -q "\"job\":\"app\""
    - curl -sSf http://prometheus:9090/api/v1/targets | grep -q "\"job\":\"cadvisor\""

  after_script:
    - docker compose ps || true
    - docker compose logs --no-color | tail -n 300 || true
    - docker compose down -v || true
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"
